; https://docs.platformio.org/page/projectconf.html

[env:canbusMonitor]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
lib_deps =
    SPI
    Wire @ ^1.0
    watterott/MCP2515@^1.0.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    adafruit/RTClib@^2.1.1
    SD
