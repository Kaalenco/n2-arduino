; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html

[env:canbusMonitor]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
lib_deps =
    SPI
    Wire @ ^1.0
    watterott/MCP2515@^1.0.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

[env:canbusMonitorSimulator]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
build_flags = -DBUILD_SIMULATOR
lib_deps =
    SPI
    Wire @ ^1.0
    watterott/MCP2515@^1.0.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
