; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:Default]
; Environment configuration for an Arduino Uno board
; This environment uses the Arduino framework and includes several libraries
platform = atmelavr

board = nanoatmega328
; Use the following line if you are using an Arduino Nano with ATmega328P (Old Bootloader)
; board = nanoatmega328old

framework = arduino

monitor_speed = 9600

lib_deps = 
	SPI
	Wire @ ^1.0
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	bblanchon/ArduinoJson@^6.17.3
	adafruit/RTClib@^2.1.4
	smougenot/TM1637@0.0.0-alpha+sha.9486982048
	adafruit/Adafruit BusIO@^1.16.1
